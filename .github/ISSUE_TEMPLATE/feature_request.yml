name: 功能建议
description: 描述使用场景、当前障碍与期望结果。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Relay 当前支持 Apple Silicon macOS、本机单用户。请先搜索已有建议。
        提交建议不代表已经承诺实现；涉及范围较大的改动请先讨论。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前障碍
      description: 你要完成什么？当前哪一步阻碍使用？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望行为
      description: 给出具体操作和结果，必要时提供脱敏示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 对会话接续、权限、数据兼容、界面或发布流程的影响。
