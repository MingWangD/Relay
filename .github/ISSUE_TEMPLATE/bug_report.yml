name: Bug 报告
description: 提供可复现的 Relay 问题；安全漏洞请使用私密入口。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有问题。不要上传凭据、完整 token 链接、数据库或原始模型终端。
        安全问题请使用 https://github.com/MingWangD/Relay/security/advisories/new 。
  - type: input
    id: relay_version
    attributes:
      label: Relay 版本与 build
      placeholder: "例如：0.1.3 / build 4；源码运行请附 commit"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本与芯片
      placeholder: "例如：macOS 26.4 / Apple Silicon arm64"
    validations:
      required: true
  - type: textarea
    id: cli
    attributes:
      label: CLI 与模型配置
      description: 相关 CLI 名称／版本、所选模型与权限；不要提供认证值。
  - type: textarea
    id: reproduction
    attributes:
      label: 最短复现步骤
      description: 从打开 App 开始；注明是否使用新建测试项目／独立数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据与影响
      description: 日志片段、截图、是否影响数据；区分真实模型与夹具结果。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 已移除凭据、完整 token 链接、个人路径和私有数据。
          required: true
